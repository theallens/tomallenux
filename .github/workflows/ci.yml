name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  # Also how Sanity starts a deploy when Tom publishes or asks for a preview
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [none, production, preview]
        default: none

# Cancel superseded runs on the same branch/PR. Previews queue separately, so one can't cancel a live deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target == 'preview' && 'preview' || 'live' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test & build
    if: inputs.target != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint and test scripts aren't set up yet; these run automatically once they exist
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: build
    environment: production
    # Production deploys only from main, never from pull requests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - id: netlify
        uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426 # pinned: review and bump manually
        with:
          args: deploy --prod --no-build --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # This action reports success even when Netlify refuses the deploy, so check it produced a URL
      - name: Check Netlify accepted the deploy
        if: steps.netlify.outputs.NETLIFY_URL == ''
        run: |
          echo "::error::Netlify did not deploy. The step above says why."
          exit 1

  deploy-preview:
    name: Deploy drafts to the preview link
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/main' && inputs.target == 'preview'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The repo is public, so this build must not upload an artifact: it would expose drafts
      - name: Build with drafts
        run: npm run build
        env:
          SANITY_PREVIEW: "true"
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}

      - id: netlify
        uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426 # pinned: review and bump manually
        with:
          args: deploy --alias=preview --no-build --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # This action reports success even when Netlify refuses the deploy, so check it produced a URL
      - name: Check Netlify accepted the deploy
        if: steps.netlify.outputs.NETLIFY_URL == ''
        run: |
          echo "::error::Netlify did not deploy. The step above says why."
          exit 1
